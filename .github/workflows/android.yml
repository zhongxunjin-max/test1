name: Android

on:
  push:
    paths: ["android-editor/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android-editor/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: video-editor-debug-apk
          path: android-editor/app/build/outputs/apk/debug/*.apk
